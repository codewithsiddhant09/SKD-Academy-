events {
    worker_connections 1024;
}

http {
    upstream bookly_app {
        server bookly-agent:8000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=5r/m;

    server {
        listen 80;
        server_name _;
        
        # Redirect HTTP to HTTPS (uncomment when SSL is configured)
        # return 301 https://$server_name$request_uri;

        client_max_body_size 10M;

        # API endpoints with rate limiting
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://bookly_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Booking endpoints with stricter rate limiting
        location /api/v1/booking/ {
            limit_req zone=booking_limit burst=5 nodelay;
            
            proxy_pass http://bookly_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Payment result page (no rate limit for user convenience)
        location /payment/paymentResult {
            proxy_pass http://bookly_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for socket.io
        location /socket.io/ {
            proxy_pass http://bookly_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoint
        location /api/v1/health {
            proxy_pass http://bookly_app;
            access_log off;
        }

        # API documentation
        location /docs {
            proxy_pass http://bookly_app;
        }

        location /openapi.json {
            proxy_pass http://bookly_app;
        }
    }

    # HTTPS configuration (uncomment and configure when SSL is ready)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     client_max_body_size 10M;
    #
    #     # Same location blocks as HTTP server above
    #     # ...
    # }
}
